[package]
name = "nodra"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Driverless, shuffle-free pipeline engine on DataFusion and Delta Lake"
license = "Apache-2.0"

[features]
default = []
azure = ["object_store/azure"]
kafka = ["dep:rdkafka"]

[dependencies]
datafusion = { version = "55.2", default-features = false, features = ["parquet", "sql", "datetime_expressions", "string_expressions", "regex_expressions", "unicode_expressions"] }
deltalake-core = { version = "1.1.2", default-features = false, features = ["rustls"] }
object_store = { version = "0.13.2", default-features = false, features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
thiserror = "2"
percent-encoding = "2"
rdkafka = { version = "0.39", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
